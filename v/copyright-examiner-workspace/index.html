    <link rel="manifest" href="/goa-proto-demo-1/v/copyright-examiner-workspace/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copyright registration</title>

    <!-- Prototypes must never be indexed by search engines. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- GitHub Pages serves only one 404 page, at the site root, so a deep link
         into a preview or snapshot build can't be answered where it lands. The
         root 404 bounces it here as <base>/?/<path> instead; this turns that
         back into a real URL before the router reads it.

         Inert everywhere else: a normal load has no query in that shape. Must
         stay ahead of the app script, so the router never sees the encoded
         form. -->
    <script>
      (function (l) {
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash,
        );
      })(window.location);
    </script>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>

      nomodule
      src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>

    <link rel="stylesheet" crossorigin href="/goa-proto-demo-1/v/copyright-examiner-workspace/assets/index-D-IQg-CT.css">
